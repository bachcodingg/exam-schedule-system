name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Demo plan still builds
        run: python -m studyplan plan data/exams_lut_2026.json --md plan.md --ics plan.ics
      - name: Demo guides still build
        run: python -m studyplan guide data/exams_lut_nov_2026.json --out guides
